<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Groundwork</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="description" content="A 12-week bodyweight and walk-to-run plan that meets you where you are.">

<!-- Makes it install to the home screen and open fullscreen, like a real app -->
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Groundwork">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)">

<style>
/* ── Design tokens ──────────────────────────────────────────────────────────
   Chart colors come from a validated palette: one blue for series, a blue
   light→dark ramp for the heatmap. Text never wears a data color.          */
:root {
  color-scheme: light;
  --surface:      #fcfcfb;
  --plane:        #f9f9f7;
  --raised:       #ffffff;
  --ink:          #0b0b0b;
  --ink-2:        #52514e;
  --muted:        #898781;
  --grid:         #e1e0d9;
  --axis:         #c3c2b7;
  --border:       rgba(11,11,11,.10);
  --series:       #2a78d6;
  --series-soft:  rgba(42,120,214,.10);
  --good:         #006300;
  --warn:         #fab219;
  /* sequential blue ramp — heatmap bins */
  --seq-0:  #e6e5df;
  --seq-1:  #b7d3f6;
  --seq-2:  #5598e7;
  --seq-3:  #256abf;
  --shadow: 0 1px 2px rgba(11,11,11,.05), 0 4px 16px rgba(11,11,11,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface:      #1a1a19;
    --plane:        #0d0d0d;
    --raised:       #232321;
    --ink:          #ffffff;
    --ink-2:        #c3c2b7;
    --muted:        #898781;
    --grid:         #2c2c2a;
    --axis:         #383835;
    --border:       rgba(255,255,255,.10);
    --series:       #3987e5;
    --series-soft:  rgba(57,135,229,.14);
    --good:         #0ca30c;
    --seq-0:  #2c2c2a;
    --seq-1:  #184f95;
    --seq-2:  #2a78d6;
    --seq-3:  #86b6ef;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface:      #1a1a19;
  --plane:        #0d0d0d;
  --raised:       #232321;
  --ink:          #ffffff;
  --ink-2:        #c3c2b7;
  --muted:        #898781;
  --grid:         #2c2c2a;
  --axis:         #383835;
  --border:       rgba(255,255,255,.10);
  --series:       #3987e5;
  --series-soft:  rgba(57,135,229,.14);
  --good:         #0ca30c;
  --seq-0:  #2c2c2a;
  --seq-1:  #184f95;
  --seq-2:  #2a78d6;
  --seq-3:  #86b6ef;
  --shadow: none;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--plane);
  color: var(--ink);
  font: 400 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  overscroll-behavior-y: none;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; }

/* ── Layout shell ───────────────────────────────────────────────────────── */
#app {
  max-width: 560px;
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  padding: max(14px, env(safe-area-inset-top)) 16px
           calc(78px + env(safe-area-inset-bottom)) 16px;
}
.screen { display: none; animation: fade .18s ease; }
.screen.on { display: block; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .screen { animation: none; } }

h1 { font-size: 26px; font-weight: 640; letter-spacing: -.02em; margin: 6px 0 2px; }
h2 { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
     color: var(--muted); margin: 26px 0 10px; }
.sub { color: var(--ink-2); font-size: 14px; margin: 0 0 18px; }

/* ── Cards ──────────────────────────────────────────────────────────────── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
}
.card.flat { box-shadow: none; }
.card-title { font-size: 17px; font-weight: 600; margin: 0 0 4px; letter-spacing: -.01em; }
.card-meta { font-size: 13px; color: var(--muted); margin: 0; }

/* ── Buttons ────────────────────────────────────────────────────────────── */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; min-height: 52px; padding: 14px 18px;
  background: var(--series); color: #fff;
  border-radius: 13px; font-size: 16px; font-weight: 600;
  transition: transform .08s ease, opacity .15s ease;
}
.btn:active { transform: scale(.985); }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--border); }
.btn.soft  { background: var(--series-soft); color: var(--series); }
.btn.sm    { min-height: 42px; padding: 9px 14px; font-size: 14.5px; border-radius: 11px; width: auto; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn-row { display: flex; gap: 8px; }
.btn-row .btn { width: auto; flex: 1; }

/* ── Stat tiles ─────────────────────────────────────────────────────────── */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.tile {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 13px 12px; text-align: left;
}
.tile .v { font-size: 25px; font-weight: 650; letter-spacing: -.02em; line-height: 1.15; }
.tile .l { font-size: 11.5px; color: var(--muted); margin-top: 3px; line-height: 1.3; }

/* Hero number — exactly one per view */
.hero { font-size: 52px; font-weight: 660; letter-spacing: -.035em; line-height: 1; }
.hero-unit { font-size: 17px; font-weight: 500; color: var(--ink-2); margin-left: 6px; letter-spacing: 0; }

/* ── Today: the plan card ───────────────────────────────────────────────── */
.plan-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 18px; padding: 20px; margin-bottom: 12px; box-shadow: var(--shadow); }
.eyebrow { font-size: 12.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
           color: var(--series); margin-bottom: 7px; }
.plan-title { font-size: 22px; font-weight: 640; letter-spacing: -.02em; margin: 0 0 6px; }
.plan-desc { font-size: 14.5px; color: var(--ink-2); margin: 0 0 16px; }
.ex-list { list-style: none; margin: 0 0 16px; padding: 0; }
.ex-list li { border-top: 1px solid var(--grid); }
.ex-list li:first-child { border-top: 0; }
.ex-row { display: flex; align-items: center; gap: 10px; width: 100%;
          padding: 11px 0; font-size: 15px; text-align: left; }
.ex-list .n { flex: 1; }
.ex-list .r { color: var(--ink-2); font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.howdot { width: 20px; height: 20px; flex: none; border-radius: 50%;
          background: var(--series-soft); color: var(--series);
          font-size: 12px; font-weight: 700; line-height: 20px; text-align: center; }

/* ── Movement demo ──────────────────────────────────────────────────── */
.demo-stage { position: relative; background: var(--plane);
              border: 1px solid var(--border); border-radius: 14px;
              padding: 12px; margin-bottom: 16px; }
.figure { display: block; width: 100%; max-width: 260px; height: auto; margin: 0 auto; }
.figure .trunk, .figure .limb { stroke: var(--series); fill: none; }
.figure .trunk { stroke-width: 5; }
.figure .limb  { stroke-width: 3.8; }
.figure .fig-head { fill: var(--series); }
.figure .fig-far  { opacity: .32; }
.demo-tag { position: absolute; right: 13px; top: 13px; font-size: 11.5px;
            color: var(--muted); letter-spacing: .01em; }
.demo-cue { font-size: 15px; color: var(--ink-2); line-height: 1.55; margin: 0 0 20px; }
.demo-h { font-size: 12.5px; font-weight: 600; letter-spacing: .04em;
          text-transform: uppercase; color: var(--muted); margin: 0 0 9px; }
.demo-list { margin: 0 0 20px; padding-left: 19px; }
.demo-list li { font-size: 14.5px; color: var(--ink-2); line-height: 1.5; margin-bottom: 9px; }
/* Reduced-motion fallback: both poses side by side instead of a loop. */
.demo-two { display: flex; gap: 8px; }
.demo-two figure { flex: 1; margin: 0; }
.demo-two figcaption { text-align: center; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.demo-two .figure { max-width: 100%; }

/* ── Habit row ──────────────────────────────────────────────────────────── */
.habits { display: flex; gap: 8px; }
.habit {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 13px 6px; border-radius: 13px;
  border: 1px solid var(--border); background: var(--surface);
  font-size: 12px; color: var(--ink-2); text-align: center; line-height: 1.25;
  transition: background .15s ease, border-color .15s ease;
}
.habit .dot {
  width: 26px; height: 26px; border-radius: 50%;
  border: 2px solid var(--axis);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; color: transparent; transition: all .15s ease;
}
.habit.on { background: var(--series-soft); border-color: transparent; color: var(--ink); }
.habit.on .dot { background: var(--series); border-color: var(--series); color: #fff; }

/* ── Bottom tab bar ─────────────────────────────────────────────────────── */
#tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  display: flex; justify-content: center; gap: 2px;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: saturate(180%) blur(16px);
  -webkit-backdrop-filter: saturate(180%) blur(16px);
  border-top: 1px solid var(--border);
  padding: 7px 8px calc(7px + env(safe-area-inset-bottom));
}
#tabs .tab {
  flex: 1; max-width: 130px;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 5px 4px; border-radius: 11px;
  font-size: 10.5px; font-weight: 550; color: var(--muted);
  transition: color .15s ease;
}
#tabs .tab svg { width: 23px; height: 23px; stroke: currentColor; fill: none;
                 stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
#tabs .tab.on { color: var(--series); }

/* ── Charts ─────────────────────────────────────────────────────────────── */
.chart-wrap { position: relative; margin: 4px 0 0; }
.chart-wrap svg { display: block; width: 100%; height: auto; overflow: visible; }
.tick { font-size: 10.5px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.endlabel { font-size: 12px; font-weight: 600; fill: var(--ink); }
.tip {
  position: absolute; pointer-events: none; opacity: 0;
  background: var(--raised); border: 1px solid var(--border);
  border-radius: 9px; padding: 7px 10px; font-size: 12.5px; line-height: 1.4;
  box-shadow: 0 4px 14px rgba(11,11,11,.13); transition: opacity .1s ease;
  white-space: nowrap; z-index: 5; color: var(--ink);
}
.tip b { font-weight: 620; font-variant-numeric: tabular-nums; }
.tip .d { color: var(--muted); font-size: 11.5px; }

/* Heatmap */
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr);
        gap: 3px; }
.heat i { display: block; width: 100%; aspect-ratio: 1; border-radius: 3px;
          background: var(--seq-0); }
.heat i.l1 { background: var(--seq-1); }
.heat i.l2 { background: var(--seq-2); }
.heat i.l3 { background: var(--seq-3); }
.heat i.future { background: transparent; box-shadow: inset 0 0 0 1px var(--grid); }
.legend { display: flex; align-items: center; gap: 6px; margin-top: 10px;
          font-size: 11.5px; color: var(--muted); }
.legend i { width: 11px; height: 11px; border-radius: 3px; display: block; }

/* Data table twin — every chart has one */
.toggle-table { font-size: 12.5px; color: var(--series); font-weight: 550; margin-top: 12px; }
table.data { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13.5px; }
table.data th, table.data td { text-align: left; padding: 7px 4px; border-bottom: 1px solid var(--grid); }
table.data th { color: var(--muted); font-weight: 550; font-size: 12px; }
table.data td.num { text-align: right; font-variant-numeric: tabular-nums; }

.empty { color: var(--muted); font-size: 14px; text-align: center; padding: 26px 10px; line-height: 1.55; }

/* ── History list ───────────────────────────────────────────────────────── */
.entry { display: flex; align-items: center; gap: 13px; padding: 13px 0; border-bottom: 1px solid var(--grid); }
.entry:last-child { border-bottom: 0; }
.entry .ic { width: 36px; height: 36px; flex: none; border-radius: 10px;
             background: var(--series-soft); display: flex; align-items: center; justify-content: center; }
.entry .ic svg { width: 19px; height: 19px; stroke: var(--series); fill: none; stroke-width: 2;
                 stroke-linecap: round; stroke-linejoin: round; }
.entry .body { flex: 1; min-width: 0; }
.entry .t { font-size: 15px; font-weight: 550; }
.entry .m { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
.entry .del { color: var(--muted); font-size: 20px; padding: 4px 8px; line-height: 1; }

/* ── Plan overview ──────────────────────────────────────────────────────── */
.phase { margin-bottom: 8px; }
.phase-head { font-size: 15px; font-weight: 620; margin-bottom: 2px; }
.phase-blurb { font-size: 13.5px; color: var(--ink-2); margin-bottom: 12px; }
.wk { display: flex; align-items: center; gap: 12px; padding: 12px 14px;
      border: 1px solid var(--border); border-radius: 12px; margin-bottom: 7px;
      background: var(--surface); text-align: left; width: 100%; }
.wk.now { border-color: var(--series); background: var(--series-soft); }
.wk.done { opacity: .55; }
.wk .num { font-size: 12px; font-weight: 620; color: var(--muted); width: 46px; flex: none;
           letter-spacing: .03em; text-transform: uppercase; }
.wk.now .num { color: var(--series); }
.wk .what { flex: 1; font-size: 14px; }
.wk .chev { color: var(--muted); font-size: 15px; }

/* ── Modal / sheet ──────────────────────────────────────────────────────── */
#veil { position: fixed; inset: 0; background: rgba(11,11,11,.45); z-index: 50;
        display: none; align-items: flex-end; justify-content: center; }
#veil.on { display: flex; }
.sheet {
  background: var(--surface); width: 100%; max-width: 560px;
  border-radius: 20px 20px 0 0; padding: 20px 18px calc(20px + env(safe-area-inset-bottom));
  max-height: 92vh; max-height: 92dvh; overflow-y: auto;
  animation: rise .22s cubic-bezier(.32,.72,0,1);
}
@keyframes rise { from { transform: translateY(100%); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
.sheet h3 { font-size: 19px; font-weight: 640; margin: 0 0 16px; letter-spacing: -.015em; }
.grab { width: 36px; height: 4px; border-radius: 2px; background: var(--axis);
        margin: -6px auto 14px; }

label.f { display: block; margin-bottom: 14px; }
label.f span { display: block; font-size: 13px; color: var(--ink-2); margin-bottom: 6px; font-weight: 500; }
.in {
  width: 100%; padding: 13px 14px; border-radius: 12px;
  border: 1px solid var(--border); background: var(--plane);
  font-size: 16px; /* 16px avoids iOS zoom-on-focus */
}
.in:focus { outline: 2px solid var(--series); outline-offset: -1px; border-color: transparent; }
textarea.in { min-height: 74px; resize: vertical; }
.seg { display: flex; gap: 6px; }
.seg button {
  flex: 1; padding: 11px 8px; border-radius: 11px; border: 1px solid var(--border);
  font-size: 14px; font-weight: 550; color: var(--ink-2); background: var(--plane);
}
.seg button.on { background: var(--series); color: #fff; border-color: transparent; }

/* ── Workout runner ─────────────────────────────────────────────────────── */
#runner { position: fixed; inset: 0; background: var(--plane); z-index: 60; display: none;
          overflow-y: auto; }
#runner.on { display: block; }
.run-inner { max-width: 560px; margin: 0 auto;
             padding: max(16px, env(safe-area-inset-top)) 18px calc(30px + env(safe-area-inset-bottom)); }
.run-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
.run-top .x { font-size: 15px; color: var(--ink-2); padding: 8px 4px; }
.run-step { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.run-name { font-size: 27px; font-weight: 650; letter-spacing: -.025em; margin: 0 0 8px; }
.run-cue { font-size: 15px; color: var(--ink-2); margin: 0 0 24px; line-height: 1.55; }
.run-target { font-size: 15px; color: var(--series); font-weight: 600; margin-bottom: 22px; }

.timer { text-align: center; padding: 18px 0 26px; }
.timer .clock { font-size: 66px; font-weight: 300; letter-spacing: -.04em;
                font-variant-numeric: tabular-nums; line-height: 1; }
.timer .phase-l { font-size: 15px; font-weight: 600; margin-top: 10px; letter-spacing: .02em; }
.timer .rounds { font-size: 13px; color: var(--muted); margin-top: 5px; font-variant-numeric: tabular-nums; }
.ring { display: block; margin: 0 auto 4px; }

.setgrid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
.setbtn {
  min-width: 62px; padding: 15px 10px; border-radius: 13px;
  border: 1px solid var(--border); background: var(--surface);
  font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
}
.setbtn .sl { font-size: 10.5px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.setbtn.done { background: var(--series); color: #fff; border-color: transparent; }
.setbtn.done .sl { color: rgba(255,255,255,.75); }

/* ── Session clock & rest timer ─────────────────────────────────────── */
.run-clock { display: flex; align-items: center; gap: 7px;
             font-size: 15px; font-weight: 600; color: var(--ink);
             font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.run-clock i { width: 7px; height: 7px; border-radius: 50%; background: var(--series);
               animation: beat 2s ease-in-out infinite; }
@keyframes beat { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .run-clock i { animation: none; } }

.rest { background: var(--series-soft); border-radius: 15px;
        padding: 15px 16px; margin-bottom: 22px; }
.rest-top { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 11px; }
.rest-top span { font-size: 13.5px; font-weight: 600; color: var(--series);
                 letter-spacing: .03em; text-transform: uppercase; }
.rest-top b { font-size: 27px; font-weight: 650; color: var(--ink);
              font-variant-numeric: tabular-nums; letter-spacing: -.025em; }
.rest-track { height: 4px; border-radius: 2px; background: var(--grid);
              overflow: hidden; margin-bottom: 13px; }
.rest-track i { display: block; height: 100%; border-radius: 2px;
                background: var(--series); transition: width .95s linear; }
.rest-btns { display: flex; gap: 8px; }
.rest-btns button { flex: 1; padding: 10px; border-radius: 11px;
                    font-size: 13.5px; font-weight: 550; color: var(--ink-2);
                    background: var(--surface); border: 1px solid var(--border); }

/* "The screen was off" prompt */
.gap { background: var(--series-soft); border-radius: 15px; padding: 17px 16px; margin-bottom: 10px; }
.gap-h { font-size: 15.5px; font-weight: 620; margin: 0 0 6px; letter-spacing: -.01em; }
.gap-b { font-size: 14px; color: var(--ink-2); line-height: 1.5; margin: 0 0 15px; }

.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
           overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
</style>
</head>
<body>

<div id="app">

  <!-- ══ TODAY ══════════════════════════════════════════════════════════ -->
  <section class="screen on" id="s-today">
    <h1 id="greet">Today</h1>
    <p class="sub" id="todayDate"></p>
    <div id="todayBody"></div>
  </section>

  <!-- ══ LOG ════════════════════════════════════════════════════════════ -->
  <section class="screen" id="s-log">
    <h1>Log</h1>
    <p class="sub">Anything you did — planned or not.</p>
    <div class="btn-row" style="margin-bottom:6px">
      <button class="btn" onclick="openLogWorkout()">+ Workout</button>
      <button class="btn ghost" onclick="openLogWeight()">+ Weight</button>
    </div>
    <h2>History</h2>
    <div class="card flat" id="history"></div>
  </section>

  <!-- ══ PROGRESS ═══════════════════════════════════════════════════════ -->
  <section class="screen" id="s-progress">
    <h1>Progress</h1>
    <p class="sub">The proof you're showing up.</p>
    <div id="progressBody"></div>
  </section>

  <!-- ══ PLAN ═══════════════════════════════════════════════════════════ -->
  <section class="screen" id="s-plan">
    <h1>The plan</h1>
    <p class="sub">12 weeks, 3 days a week. It waits for you — miss a day and nothing is lost.</p>
    <div id="planBody"></div>
    <h2>Settings</h2>
    <div class="card">
      <label class="f">
        <span>Units</span>
        <div class="seg" id="unitSeg">
          <button onclick="setUnits('imperial')">lb / miles</button>
          <button onclick="setUnits('metric')">kg / km</button>
        </div>
      </label>
      <div class="btn-row">
        <button class="btn ghost sm" onclick="exportData()">Export backup</button>
        <button class="btn ghost sm" onclick="importData()">Import</button>
      </div>

<!-- ══ WORKOUT RUNNER ══════════════════════════════════════════════════ -->
<div id="runner"><div class="run-inner" id="runBody"></div></div>

<script>
"use strict";

/* ═══════════════════════════════════════════════════════════════════════
   1. THE PROGRAM
   12 weeks · 3 days/week · bodyweight + outdoor · sedentary start.

   Two ideas drive the design:
   · Start almost embarrassingly easy. Quitting in week 3 from soreness is
     the single most common way a beginner plan fails.
   · Progress on effort completed, not on the calendar. Miss two weeks and
     you resume exactly where you stopped — see currentWeek().
   ══════════════════════════════════════════════════════════════════════ */

const PHASES = [
  { name: "Foundation", weeks: [1,2,3],
    blurb: "Build the habit before you build the fitness. These sessions should feel easy — that's on purpose." },
  { name: "Build", weeks: [4,5,6,7],
    blurb: "Jogging enters, in short intervals. Strength moves get harder and volume goes up." },
  { name: "Progress", weeks: [8,9,10,11,12],
    blurb: "Longer runs, harder movements. By week 12 you'll jog 20 minutes without stopping." },
];

const phaseOf = w => w <= 3 ? 0 : w <= 7 ? 1 : 2;

// Each move carries three progressions — one per phase — plus sets × reps.
const DAY_A = {
  title: "Strength A",
  focus: "Push & core",
  moves: [
    { name: ["Wall push-up", "Incline push-up", "Knee push-up"],
      fig:  ["pushWall", "pushIncline", "pushKnee"],
      cue: "Hands a bit wider than shoulders. Lower slowly — three seconds down — and keep your body one straight line from head to heels.",
      sets: [2,3,3], reps: [8,10,12] },
    { name: ["Sit-to-stand squat", "Bodyweight squat", "Tempo squat"],
      fig:  ["squatChair", "squat", "squat"],
      cue: "Sit back onto a chair, tap it lightly, stand up. Knees track over your toes; chest stays proud.",
      sets: [2,3,3], reps: [8,12,12] },
    { name: ["Glute bridge", "Glute bridge (2s hold)", "Single-leg glute bridge"],
      fig:  ["bridge", "bridge", "bridgeOne"],
      cue: "Lie on your back, feet flat. Squeeze your glutes to lift your hips — the work is in the glutes, not the lower back.",
      sets: [2,3,3], reps: [10,12,8] },
    { name: ["Dead bug", "Forearm plank", "Forearm plank"],
      fig:  ["deadbug", "plank", "plank"],
      cue: "Brace like you're about to be poked in the stomach. Slow and controlled beats fast and sloppy.",
      sets: [2,3,3], reps: [8,20,40], hold: [false,true,true] },
  ],
};

const DAY_B = {
  title: "Strength B",
  focus: "Legs & pull",
  moves: [
    { name: ["Assisted split squat", "Split squat", "Reverse lunge"],
      fig:  ["splitAssist", "split", "lunge"],
      cue: "One foot forward, one back. Drop straight down, not forward. Hold a wall for balance as long as you need it.",
      sets: [2,3,3], reps: [6,8,10] },
    { name: ["Doorway row", "Towel row", "Table row"],
      fig:  ["rowDoor", "rowDoor", "rowTable"],
      cue: "Grip a sturdy doorframe, lean back with straight arms, pull your chest toward your hands. Squeeze the shoulder blades.",
      sets: [2,3,3], reps: [8,10,12] },
    { name: ["Hip hinge", "Hip hinge (slow)", "Single-leg deadlift"],
      fig:  ["hinge", "hinge", "sldl"],
      cue: "Push your hips back like you're closing a car door with them. Back stays flat — this is not a squat.",
      sets: [2,3,3], reps: [10,12,10] },
    { name: ["Side plank (knees)", "Side plank (knees)", "Side plank"],
      fig:  ["sidePlankKnee", "sidePlankKnee", "sidePlank"],
      cue: "Stack your shoulders and hips. Lift your hips until your body is one straight line. Each side.",
      sets: [2,2,3], reps: [15,25,30], hold: [true,true,true] },
    { name: ["Calf raise", "Step-up", "Step-up"],
      fig:  ["calf", "stepup", "stepup"],
      cue: "Slow up, slower down. Full range — heels all the way down at the bottom.",
      sets: [2,3,3], reps: [12,10,12] },
  ],
};

// Walk-to-run ladder. Weeks 1–3 are walking only — a sedentary body needs
// a few weeks of load before jogging stops being a joint risk.
const CARDIO = {
  1:  { kind:"steady",   min:20, label:"Brisk walk",
        desc:"Brisk enough that talking takes a little effort, easy enough that you could still hold a conversation." },
  2:  { kind:"steady",   min:25, label:"Brisk walk",
        desc:"Same effort, five more minutes. If it feels easy, that's the plan working." },
  3:  { kind:"steady",   min:30, label:"Brisk walk",
        desc:"Last walking-only week. Find a route you actually enjoy — you'll be running it soon." },
  4:  { kind:"interval", warm:5, rounds:6, jog:60,  walk:120, cool:5, label:"First jog intervals",
        desc:"One minute of jogging at a pace you could sustain for ten. Slower than you think." },
  5:  { kind:"interval", warm:5, rounds:8, jog:60,  walk:90,  cool:5, label:"Jog intervals",
        desc:"Two more rounds, shorter walks. Keep the jog pace conversational." },
  6:  { kind:"interval", warm:5, rounds:6, jog:90,  walk:120, cool:5, label:"Jog intervals",
        desc:"Ninety-second jogs. If you're gasping, slow down — pace is not the goal yet." },
  7:  { kind:"interval", warm:5, rounds:6, jog:120, walk:120, cool:5, label:"Jog intervals",
        desc:"Two minutes on, two minutes off. Even split for the first time." },
  8:  { kind:"interval", warm:5, rounds:5, jog:180, walk:120, cool:5, label:"Longer intervals",
        desc:"Three-minute jogs. The walk breaks are now shorter than the runs." },
  9:  { kind:"interval", warm:5, rounds:4, jog:240, walk:120, cool:5, label:"Longer intervals",
        desc:"Four minutes. You're running sixteen minutes total today — a month ago that was unthinkable." },
  10: { kind:"interval", warm:5, rounds:4, jog:300, walk:120, cool:5, label:"Five-minute blocks",
        desc:"Five-minute blocks. Settle into a rhythm and let your breathing lead." },
  11: { kind:"interval", warm:5, rounds:3, jog:480, walk:120, cool:5, label:"Eight-minute blocks",
        desc:"Eight minutes at a time. Almost there." },
  12: { kind:"steady",   min:20, label:"20-minute continuous jog", run:true,
        desc:"No walk breaks. Start slower than feels right — you have twenty minutes to spend, not five." },
};

const dayTemplate = idx => idx === 0 ? DAY_A : idx === 1 ? "cardio" : DAY_B;

/* Build the concrete session for a given week (1–12) and day (0–2). */
function session(week, dayIdx) {
  const p = phaseOf(week);
  const t = dayTemplate(dayIdx);
  if (t === "cardio") {
    const c = CARDIO[week];
    return { type:"cardio", week, dayIdx, phase:p, title:c.label, desc:c.desc, cardio:c,
             focus: c.kind === "interval" ? "Walk / jog intervals" : (c.run ? "Continuous jog" : "Walking") };
  }
  return {
    type: "strength", week, dayIdx, phase: p, title: t.title, focus: t.focus,
    desc: PHASES[p].blurb,
    moves: t.moves.map(m => ({
      name: m.name[p], cue: m.cue, fig: m.fig ? m.fig[p] : null,
      sets: m.sets[p], reps: m.reps[p],
      hold: m.hold ? m.hold[p] : false,
    })),
  };
}

function sessionSummary(week, dayIdx) {
  const s = session(week, dayIdx);
  if (s.type === "cardio") {
    const c = s.cardio;
    return c.kind === "steady"
      ? `${c.label} · ${c.min} min`
      : `${c.rounds} × ${fmtDur(c.jog)} jog / ${fmtDur(c.walk)} walk`;
  }
  return `${s.title} · ${s.moves.length} moves`;
}

/* ═══════════════════════════════════════════════════════════════════════
   2. STATE
   ══════════════════════════════════════════════════════════════════════ */

const KEY = "groundwork.v1";
const blank = () => ({
  version: 1,
  started: today(),
  units: "imperial",
  workouts: [],      // {id, date, type, title, planWeek, planDay, duration, distance, moves[], note}
  weights: [],       // {id, date, kg}
  habits: {},        // 'YYYY-MM-DD': {moved:bool, ate:bool, slept:bool}
});

let S = load();

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return blank();
    return Object.assign(blank(), JSON.parse(raw));
  } catch (e) {
    console.warn("Could not read saved data — starting fresh.", e);
    return blank();
  }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { alert("Couldn't save — your device may be out of storage."); }
}

/* Plan position advances with completed plan sessions, not the calendar. */
const planDone = () => S.workouts.filter(w => w.planWeek).length;
function currentWeek() { return Math.min(12, Math.floor(planDone() / 3) + 1); }
function currentDay()  { return planDone() % 3; }
const planFinished = () => planDone() >= 36;

/* ═══════════════════════════════════════════════════════════════════════
   3. HELPERS
   ══════════════════════════════════════════════════════════════════════ */

const $  = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10);

function today() { return iso(new Date()); }
function iso(d) {
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0")
         + "-" + String(d.getDate()).padStart(2,"0");
}
function parseISO(s) { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
function addDays(d, n) { const c = new Date(d); c.setDate(c.getDate()+n); return c; }
function daysBetween(a, b) { return Math.round((parseISO(b) - parseISO(a)) / 86400000); }

function fmtDate(s) {
  const d = parseISO(s), t = today();
  if (s === t) return "Today";
  if (s === iso(addDays(new Date(), -1))) return "Yesterday";
  return d.toLocaleDateString(undefined, { month:"short", day:"numeric" });
}
function fmtDur(sec) {
  if (sec < 60) return sec + "s";
  const m = Math.floor(sec/60), s = sec % 60;
  return s ? `${m}:${String(s).padStart(2,"0")}` : `${m} min`;
}
function clock(sec) {
  const m = Math.floor(sec/60), s = sec % 60;
  return `${m}:${String(s).padStart(2,"0")}`;
}
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

/* Units — stored canonically (kg, km), displayed per preference. */
const metric = () => S.units === "metric";
const wUnit  = () => metric() ? "kg" : "lb";
const dUnit  = () => metric() ? "km" : "mi";
const toDisplayW = kg => metric() ? kg : kg * 2.20462;
const toStoreW   = v  => metric() ? v  : v / 2.20462;
const toDisplayD = km => metric() ? km : km * 0.621371;
const toStoreD   = v  => metric() ? v  : v / 0.621371;

/* ═══════════════════════════════════════════════════════════════════════
   4. STREAKS & STATS
   ══════════════════════════════════════════════════════════════════════ */

/* A "week streak" — consecutive weeks with at least 2 sessions. Daily
   streaks punish rest days, which a 3-day plan is built around. */
function weekStreak() {
  const byWeek = {};
  S.workouts.forEach(w => {
    const d = parseISO(w.date);
    const monday = addDays(d, -((d.getDay() + 6) % 7));
    byWeek[iso(monday)] = (byWeek[iso(monday)] || 0) + 1;
  });
  const now = new Date();
  let cursor = addDays(now, -((now.getDay() + 6) % 7));
  let streak = 0;
  // The in-progress week only breaks the streak once it's over.
  if ((byWeek[iso(cursor)] || 0) < 2) cursor = addDays(cursor, -7);
  while ((byWeek[iso(cursor)] || 0) >= 2) { streak++; cursor = addDays(cursor, -7); }
  return streak;
}
function thisWeekCount() {
  const now = new Date();
  const monday = iso(addDays(now, -((now.getDay() + 6) % 7)));
  return S.workouts.filter(w => w.date >= monday).length;
}
function totalMinutes() { return S.workouts.reduce((a,w) => a + (w.duration||0), 0); }
function totalDistance() { return S.workouts.reduce((a,w) => a + (w.distance||0), 0); }

/* ═══════════════════════════════════════════════════════════════════════
   5. NAVIGATION
   ══════════════════════════════════════════════════════════════════════ */

let screen = "today";
document.querySelectorAll("#tabs .tab").forEach(b =>
  b.addEventListener("click", () => go(b.dataset.go)));

function go(name) {
  screen = name;
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("on"));
  $("#s-" + name).classList.add("on");
  document.querySelectorAll("#tabs .tab").forEach(t =>
    t.classList.toggle("on", t.dataset.go === name));
  window.scrollTo(0, 0);
  render();
}

function render() {
  if (screen === "today")    renderToday();
  if (screen === "log")      renderHistory();
  if (screen === "progress") renderProgress();
  if (screen === "plan")     renderPlan();
}

/* ═══════════════════════════════════════════════════════════════════════
   6. TODAY
   ══════════════════════════════════════════════════════════════════════ */

/* Shared by the Today card and the week sheet. Each row opens its demo. */
function exListHTML(s, week, dayIdx) {
  return `<ul class="ex-list">` + s.moves.map((m, i) =>
    `<li><button class="ex-row" onclick="demoMove(${week},${dayIdx},${i})">
        <span class="n">${esc(m.name)}</span>
        <span class="r">${m.sets} × ${m.hold ? m.reps + "s" : m.reps}</span>
        ${m.fig ? `<span class="howdot" aria-hidden="true">?</span>` : ""}
      </button></li>`).join("") + `</ul>`;
}

function renderToday() {
  const h = new Date().getHours();
  $("#greet").textContent = h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
  $("#todayDate").textContent =
    new Date().toLocaleDateString(undefined, { weekday:"long", month:"long", day:"numeric" });

  const wk = currentWeek(), dy = currentDay();
  const s = session(wk, dy);
  const didToday = S.workouts.filter(w => w.date === today());
  const streak = weekStreak();
  const hab = S.habits[today()] || {};
  let html = "";

  // Stat tiles
  html += `<div class="tiles">
    <div class="tile"><div class="v">${streak}</div><div class="l">week streak</div></div>
    <div class="tile"><div class="v">${thisWeekCount()}</div><div class="l">sessions this week</div></div>
    <div class="tile"><div class="v">${planDone()}<span style="font-size:15px;color:var(--muted)">/36</span></div><div class="l">plan complete</div></div>
  </div>`;

  // The plan card
  if (planFinished()) {
    html += `<div class="plan-card">
      <div class="eyebrow">Program complete</div>
      <p class="plan-title">You finished all 12 weeks.</p>
      <p class="plan-desc">Thirty-six sessions from a standing start. Keep logging freely,
        or restart the plan at a harder starting point.</p>
      <button class="btn ghost" onclick="restartPlan()">Restart the plan</button>
    </div>`;
  } else {
    const doneToday = didToday.some(w => w.planWeek === wk && w.planDay === dy);
    html += `<div class="plan-card">
      <div class="eyebrow">Week ${wk} · Day ${dy+1} · ${PHASES[s.phase].name}</div>
      <p class="plan-title">${esc(s.title)}</p>
      <p class="plan-desc">${esc(s.desc)}</p>`;

    if (s.type === "strength") {
      html += exListHTML(s, wk, dy);
    } else {
      const c = s.cardio;
      html += `<ul class="ex-list">`;
      if (c.kind === "steady") {
        html += `<li><span class="n">${c.run ? "Jog" : "Brisk walk"}</span><span class="r">${c.min} min</span></li>`;
      } else {
        html += `<li><span class="n">Warm-up walk</span><span class="r">${c.warm} min</span></li>
                 <li><span class="n">Jog / walk × ${c.rounds}</span><span class="r">${fmtDur(c.jog)} / ${fmtDur(c.walk)}</span></li>
                 <li><span class="n">Cool-down walk</span><span class="r">${c.cool} min</span></li>`;
      }
      html += `</ul>`;
    }

    html += doneToday
      ? `<button class="btn soft" onclick="startRunner(${wk},${dy})">Done today · do it again</button>`
      : `<button class="btn" onclick="startRunner(${wk},${dy})">Start this session</button>`;
    html += `</div>`;
  }

  // Habits
  html += `<h2>Today's basics</h2><div class="habits">
    ${habitBtn("moved", "Moved", hab.moved)}
    ${habitBtn("ate",   "Ate well", hab.ate)}
    ${habitBtn("slept", "Slept 7h+", hab.slept)}
  </div>`;

  // What you already did today
  if (didToday.length) {
    html += `<h2>Logged today</h2><div class="card flat">` +
      didToday.map(entryRow).join("") + `</div>`;
  }

  $("#todayBody").innerHTML = html;
}

const habitBtn = (k, label, on) =>
  `<button class="habit${on ? " on" : ""}" onclick="toggleHabit('${k}')" aria-pressed="${!!on}">
     <span class="dot">✓</span>${label}
   </button>`;

function toggleHabit(k) {
  const d = today();
  S.habits[d] = S.habits[d] || {};
  S.habits[d][k] = !S.habits[d][k];
  if (navigator.vibrate) navigator.vibrate(8);
  save(); renderToday();
}

function restartPlan() {
  if (!confirm("Restart the 12-week plan from week 1? Your logged history stays.")) return;
  S.workouts.forEach(w => { delete w.planWeek; delete w.planDay; });
  save(); render();
}

/* ═══════════════════════════════════════════════════════════════════════
   7. WORKOUT RUNNER
   ══════════════════════════════════════════════════════════════════════ */

let R = null;          // active run state

const REST_SEC = 60;   // rest between sets — plenty for bodyweight work
let sessTick = null;   // 1s heartbeat that runs for the whole session

function startRunner(week, dayIdx) {
  const s = session(week, dayIdx);
  R = { s, i: 0, done: {}, startedAt: Date.now(),
        timer: null, running: false, rest: null };
  if (s.type === "cardio") R.timer = buildCardioTimer(s.cardio);
  $("#runner").classList.add("on");
  document.body.style.overflow = "hidden";
  sessTick = setInterval(runnerSecond, 1000);
  keepAwake();
  drawRunner();
}

/* One place to tear everything down, so no interval outlives the session. */
function endRunner() {
  stopTick();
  if (sessTick) { clearInterval(sessTick); sessTick = null; }
  if (holdT) { clearInterval(holdT.h); holdT = null; }
  releaseWake();
  R = null;
  $("#runner").classList.remove("on");
  document.body.style.overflow = "";
}

function closeRunner(skipConfirm) {
  if (!skipConfirm && !confirm("Leave this session? Nothing will be logged.")) return;
  endRunner();
  render();
}

/* ── Session clock & rest between sets ──────────────────────────────────
   Both work off timestamps rather than counting down a variable, so a
   locked screen or a backgrounded tab can't make them drift.            */

function elapsedSec() { return R ? Math.floor((Date.now() - R.startedAt) / 1000) : 0; }
function restLeft()   { return R && R.rest ? Math.max(0, Math.round((R.rest.endsAt - Date.now()) / 1000)) : 0; }

function hms(sec) {
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return h ? `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`
           : `${m}:${String(s).padStart(2,"0")}`;
}

function runnerSecond() {
  if (!R) return;
  const c = document.getElementById("sessElapsed");
  if (c) c.textContent = hms(elapsedSec());

  if (R.rest) {
    const left = restLeft();
    if (left <= 0) {
      R.rest = null;
      beep(760, .3);
      if (navigator.vibrate) navigator.vibrate([130, 70, 130]);
      drawRunner();
    } else {
      const t = document.getElementById("restLeft");
      const b = document.getElementById("restBar");
      if (t) t.textContent = clock(left);
      if (b) b.style.width = (100 * (1 - left / R.rest.total)).toFixed(1) + "%";
    }
  }

  if (R.timer && R.running) cardioSecond();
}

function startRest() {
  const s = R.s, m = s.moves[R.i];
  const lastMove = R.i === s.moves.length - 1;
  const setsDone = R.done[R.i] || 0;
  // No point resting after the very last set — the session is over.
  if (lastMove && setsDone >= m.sets) { R.rest = null; return; }
  R.rest = { endsAt: Date.now() + REST_SEC * 1000, total: REST_SEC };
}

function skipRest() { R.rest = null; drawRunner(); }
function addRest(sec) {
  if (!R.rest) return;
  R.rest.endsAt += sec * 1000;
  R.rest.total += sec;
  drawRunner();
}

/* Keep the screen on for the session — otherwise the phone sleeps mid-set
   and the timers stop being visible. */
let wake = null;
async function keepAwake() {
  if (!("wakeLock" in navigator)) return;
  try { wake = await navigator.wakeLock.request("screen"); } catch (e) { /* denied or unsupported */ }
}
function releaseWake() {
  if (wake) { try { wake.release(); } catch (e) {} wake = null; }
}

/* Flatten interval work into a simple queue of phases. */
function buildCardioTimer(c) {
  const q = [];
  if (c.kind === "steady") {
    q.push({ label: c.run ? "Jog" : "Brisk walk", sec: c.min * 60, kind: "work" });
  } else {
    q.push({ label: "Warm-up walk", sec: c.warm * 60, kind: "warm" });
    for (let r = 0; r < c.rounds; r++) {
      q.push({ label: "Jog",  sec: c.jog,  kind: "work", round: r + 1, of: c.rounds });
      if (r < c.rounds - 1) q.push({ label: "Walk", sec: c.walk, kind: "rest", round: r + 1, of: c.rounds });
    }
    q.push({ label: "Cool-down walk", sec: c.cool * 60, kind: "cool" });
  }
  // endsAt is the wall-clock moment the current phase ends; lastSeen is when
  // we last got a tick, which is how a suspended screen gets noticed.
  return { q, at: 0, left: q[0].sec, endsAt: null, lastSeen: null, gap: 0, over: false };
}

/* Work actually done, derived from position — never a running total that
   could drift out of step with the queue. */
function cardioElapsed(t) {
  let s = 0;
  for (let i = 0; i < t.at; i++) s += t.q[i].sec;
  return s + (t.q[t.at].sec - t.left);
}

function drawRunner() {
  if (!R) return;
  const s = R.s;
  let html = `<div class="run-top">
      <button class="x" onclick="closeRunner()">✕ Close</button>
      <span class="run-clock"><i></i><span id="sessElapsed">${hms(elapsedSec())}</span></span>
      <span class="run-step">Week ${s.week} · Day ${s.dayIdx + 1}</span>
    </div>`;

  if (s.type === "strength") {
    const m = s.moves[R.i];
    const doneSets = R.done[R.i] || 0;
    html += `<div class="run-step" style="margin-bottom:8px">Move ${R.i+1} of ${s.moves.length}</div>
      <div class="run-name">${esc(m.name)}</div>
      <p class="run-target">${m.sets} sets × ${m.hold ? m.reps + " seconds" : m.reps + " reps"}</p>
      <p class="run-cue">${esc(m.cue)}</p>
      ${m.fig ? `<button class="btn soft sm" style="margin:-8px 0 22px"
          onclick="demoCurrentMove()">Show me how</button>` : ""}`;

    if (m.hold) {
      html += holdTimerHTML(m.reps);
    }

    html += `<div class="setgrid">` +
      Array.from({length: m.sets}, (_, i) =>
        `<button class="setbtn${i < doneSets ? " done" : ""}" onclick="toggleSet(${i})">
           <span class="sl">Set ${i+1}</span>${m.hold ? m.reps + "s" : m.reps}
         </button>`).join("") + `</div>`;

    if (R.rest) {
      const left = restLeft();
      html += `<div class="rest">
        <div class="rest-top"><span>Rest</span><b id="restLeft">${clock(left)}</b></div>
        <div class="rest-track"><i id="restBar"
          style="width:${(100 * (1 - left / R.rest.total)).toFixed(1)}%"></i></div>
        <div class="rest-btns">
          <button onclick="addRest(30)">+30s</button>
          <button onclick="skipRest()">Skip rest</button>
        </div>
      </div>`;
    }

    html += `<div class="btn-row">`;
    if (R.i > 0) html += `<button class="btn ghost" onclick="moveStep(-1)">Back</button>`;
    html += R.i < s.moves.length - 1
      ? `<button class="btn" onclick="moveStep(1)">Next move</button>`
      : `<button class="btn" onclick="finishRun()">Finish session</button>`;
    html += `</div>`;

  } else {
    const t = R.timer, ph = t.q[t.at];
    const total = ph.sec, frac = total ? (total - t.left) / total : 0;
    const started = cardioElapsed(t) > 0;
    html += `<div class="run-name" style="font-size:22px">${esc(s.title)}</div>
      <p class="run-cue" style="margin-bottom:8px">${esc(s.desc)}</p>
      <div class="timer">
        ${ringSVG(frac, ph.kind)}
        <div class="clock" id="cardioClock">${clock(t.left)}</div>
        <div class="phase-l" style="color:${ph.kind === "work" ? "var(--series)" : "var(--ink-2)"}">${
          t.over ? "Session complete" : ph.label}</div>
        ${ph.round && !t.over ? `<div class="rounds">Round ${ph.round} of ${ph.of}</div>` : ""}
      </div>`;

    if (t.gap) {
      // We can't know whether they carried on while the screen was off, and
      // guessing wrong either loses real work or invents it. So ask.
      html += `<div class="gap">
        <p class="gap-h">The screen was off for ${hms(Math.round(t.gap / 1000))}.</p>
        <p class="gap-b">Did you keep going? If so we'll jump to where you
          actually are; otherwise we'll pick up right where you left off.</p>
        <div class="btn-row">
          <button class="btn" onclick="resumeAfterGap(true)">I kept going</button>
          <button class="btn ghost" onclick="resumeAfterGap(false)">I stopped</button>
        </div>
      </div>`;
    } else if (!t.over) {
      html += `<div class="btn-row" style="margin-bottom:8px">
        <button class="btn ${R.running ? "ghost" : ""}" onclick="toggleTick()">${
          R.running ? "Pause" : (started ? "Resume" : "Start")}</button>
        <button class="btn ghost" onclick="skipPhase()">Skip</button>
      </div>`;
    }

    html += `<button class="btn ${t.over ? "" : "soft"}" onclick="finishRun()">Finish session</button>`;
  }

  $("#runBody").innerHTML = html;
}

/* A hold timer for planks — separate from the cardio queue. */
let holdT = null;
function holdTimerHTML(sec) {
  const left = holdT ? holdT.left : sec;
  return `<div class="timer" style="padding:6px 0 18px">
      <div class="clock" style="font-size:48px">${clock(left)}</div>
      <button class="btn ${holdT && holdT.on ? "ghost" : "soft"}" style="margin-top:12px"
        onclick="toggleHold(${sec})">${holdT && holdT.on ? "Pause hold" : "Start hold"}</button>
    </div>`;
}
function toggleHold(sec) {
  if (holdT && holdT.on) { clearInterval(holdT.h); holdT.on = false; drawRunner(); return; }
  holdT = holdT && holdT.left > 0 ? holdT : { left: sec, on: false, h: null };
  holdT.on = true;
  holdT.h = setInterval(() => {
    holdT.left--;
    if (holdT.left <= 0) {
      clearInterval(holdT.h); holdT.on = false; holdT.left = 0;
      beep(880, .25); if (navigator.vibrate) navigator.vibrate([120,60,120]);
    }
    drawRunner();
  }, 1000);
  drawRunner();
}

function ringSVG(frac, kind) {
  const r = 54, c = 2 * Math.PI * r;
  const col = kind === "work" ? "var(--series)" : "var(--axis)";
  return `<svg class="ring" width="132" height="132" viewBox="0 0 132 132" aria-hidden="true">
    <circle cx="66" cy="66" r="${r}" fill="none" stroke="var(--grid)" stroke-width="5"/>
    <circle id="ringFg" cx="66" cy="66" r="${r}" fill="none" stroke="${col}" stroke-width="5"
      stroke-linecap="round" stroke-dasharray="${c}"
      stroke-dashoffset="${c * (1 - frac)}" transform="rotate(-90 66 66)"/>
  </svg>`;
}

function toggleSet(i) {
  const cur = R.done[R.i] || 0;
  const marking = (i + 1 !== cur);
  R.done[R.i] = marking ? i + 1 : i;           // tap the last done set to undo it
  if (navigator.vibrate) navigator.vibrate(8);
  if (marking) startRest(); else R.rest = null;
  drawRunner();
}
function moveStep(d) {
  if (holdT) { clearInterval(holdT.h); holdT = null; }
  R.rest = null;                               // a new move starts fresh
  R.i = Math.max(0, Math.min(R.s.moves.length - 1, R.i + d));
  window.scrollTo(0, 0);
  drawRunner();
}

/* A gap longer than this means the screen was off or the app was
   backgrounded — long enough that we shouldn't guess what happened. */
const GAP_ASK = 15000;

function toggleTick() {
  if (R.running) { stopTick(); }
  else {
    const t = R.timer;
    R.running = true;
    t.endsAt = Date.now() + t.left * 1000;
    t.lastSeen = Date.now();
  }
  drawRunner();
}

function stopTick() {
  if (!R) return;
  R.running = false;
  if (R.timer) { R.timer.endsAt = null; R.timer.lastSeen = null; }
}

function cue(phase) {
  const work = phase.kind === "work";
  beep(work ? 880 : 520, .2);
  if (navigator.vibrate) navigator.vibrate(work ? [140,70,140] : 110);
}

function finishCardio() {
  const t = R.timer;
  stopTick();
  t.left = 0; t.over = true;
  beep(880, .5);
  if (navigator.vibrate) navigator.vibrate([200,90,200,90,200]);
}

/* Advance the queue to wherever wall-clock says we are. Returns true if a
   phase boundary was crossed, so the caller knows a full redraw is due. */
function advanceCardio(now) {
  const t = R.timer;
  let moved = false;
  while (t.endsAt && now >= t.endsAt) {
    if (t.at < t.q.length - 1) {
      t.at++;
      t.endsAt += t.q[t.at].sec * 1000;
      moved = true;
      if (now < t.endsAt) cue(t.q[t.at]);   // only sound the phase we land in
    } else {
      finishCardio();
      return true;
    }
  }
  if (t.endsAt) t.left = Math.max(0, Math.ceil((t.endsAt - now) / 1000));
  return moved;
}

/* Called once per second while a cardio session is running. */
function cardioSecond() {
  const t = R.timer, now = Date.now();
  const gap = t.lastSeen ? now - t.lastSeen : 0;
  t.lastSeen = now;

  // A big gap means we genuinely don't know whether they kept moving.
  if (gap > GAP_ASK) {
    R.running = false;
    t.gap = gap;
    drawRunner();
    return;
  }
  if (advanceCardio(now)) drawRunner(); else paintCardio();
}

/* Resolve the "screen was off" question. */
function resumeAfterGap(keptGoing) {
  const t = R.timer, now = Date.now();
  t.gap = 0;
  if (keptGoing) {
    advanceCardio(now);                       // wall-clock is the truth
  } else {
    t.endsAt = now + t.left * 1000;           // treat the gap as paused
  }
  if (!t.over) {
    R.running = true;
    t.endsAt = t.endsAt || now + t.left * 1000;
    t.lastSeen = now;
  }
  drawRunner();
}

/* Repaint only the digits and the ring — a full redraw every second makes
   the buttons flicker and throws away the DOM for no reason. */
function paintCardio() {
  const t = R.timer, ph = t.q[t.at];
  const c = document.getElementById("cardioClock");
  if (c) c.textContent = clock(t.left);
  const ring = document.getElementById("ringFg");
  if (ring) {
    const circ = 2 * Math.PI * 54;
    const frac = ph.sec ? (ph.sec - t.left) / ph.sec : 0;
    ring.setAttribute("stroke-dashoffset", circ * (1 - frac));
  }
}

function skipPhase() {
  const t = R.timer, now = Date.now();
  if (t.at < t.q.length - 1) {
    t.at++;
    t.left = t.q[t.at].sec;
    if (R.running) t.endsAt = now + t.left * 1000;
  } else {
    finishCardio();
  }
  drawRunner();
}

/* Short tone via Web Audio — no sound files to load. */
let ac = null;
function beep(freq, dur) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.value = freq; o.type = "sine";
    g.gain.setValueAtTime(.0001, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.35, ac.currentTime + .02);
    g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + dur + .02);
  } catch (e) { /* audio blocked — the vibration still fires */ }
}

function finishRun() {
  const s = R.s;
  const mins = Math.max(1, Math.round((Date.now() - R.startedAt) / 60000));
  const w = {
    id: uid(), date: today(), type: s.type, title: s.title,
    planWeek: s.week, planDay: s.dayIdx, duration: mins, note: "",
  };
  if (s.type === "strength") {
    w.moves = s.moves.map((m, i) => ({
      name: m.name, target: m.sets, done: R.done[i] || 0,
      reps: m.reps, hold: m.hold,
    }));
  } else {
    // Timed work is the truth; fall back to wall-clock if the timer never ran.
    const worked = cardioElapsed(R.timer);
    w.duration = worked > 0 ? Math.max(1, Math.round(worked / 60)) : mins;
    w.distance = null;
  }
  S.workouts.push(w);
  S.habits[today()] = Object.assign({}, S.habits[today()], { moved: true });
  save();
  endRunner();

  const wk = currentWeek();
  celebrate(s, wk);
}

function celebrate(s, wk) {
  const done = planDone();
  let msg = "Logged. That's one more than yesterday.";
  if (done === 1)  msg = "First session done. The hardest one is behind you.";
  if (done === 3)  msg = "Week 1 complete. This is the part most people never reach.";
  if (done === 9)  msg = "Three weeks in. Next week you start jogging.";
  if (done === 18) msg = "Halfway. Look at the Progress tab — that's all you.";
  if (done === 36) msg = "Twelve weeks. You just ran twenty minutes without stopping.";
  openSheet(`
    <div class="grab"></div>
    <h3>Session complete</h3>
    <p class="sub" style="margin-bottom:20px">${esc(msg)}</p>
    <button class="btn" onclick="closeSheet(); go('today')">Done</button>
  `);
}

         el:[60,34], wr:[62,46] },
    watch: ["Drive through the heel of the foot on the step — don't push off the floor.",
            "Lower yourself back down slowly instead of dropping."],
  },
};

/* ── Renderer ───────────────────────────────────────────────────────── */

/* `toe` is optional — it draws a foot, which is the only way a heel raise
   reads as a heel raise rather than the figure levitating. */
const JOINTS = ["hd","sh","hip","kn","an","el","wr","kn2","an2","el2","wr2","toe"];

/* Fill in a far arm/leg when the pose doesn't name one. */
function fullPose(p) {
  const q = {};
  JOINTS.forEach(k => { if (p[k]) q[k] = p[k]; });
  const off = 5;
  if (!q.kn2 && q.kn) q.kn2 = [q.kn[0] + off, q.kn[1]];
  if (!q.an2 && q.an) q.an2 = [q.an[0] + off, q.an[1]];
  if (!q.el2 && q.el) q.el2 = [q.el[0] + off, q.el[1]];
  if (!q.wr2 && q.wr) q.wr2 = [q.wr[0] + off, q.wr[1]];
  return q;
}

const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;

function lerpPose(A, B, t) {
  const e = ease(t), out = {};
  JOINTS.forEach(k => {
    if (!A[k] || !B[k]) return;
    out[k] = [A[k][0] + (B[k][0]-A[k][0])*e, A[k][1] + (B[k][1]-A[k][1])*e];
  });
  return out;
}

function propSVG(p) {
  const s = 'fill="var(--grid)" stroke="var(--axis)" stroke-width="1.2"';
  switch (p.t) {
    case "floor": return `<line x1="2" y1="92" x2="98" y2="92" stroke="var(--axis)" stroke-width="1.6"/>`;
    case "wall":  return `<line x1="${p.x}" y1="6" x2="${p.x}" y2="92" stroke="var(--axis)" stroke-width="1.6"/>
                          <line x1="2" y1="92" x2="98" y2="92" stroke="var(--axis)" stroke-width="1.6"/>`;
    case "post":  return `<line x1="${p.x}" y1="4" x2="${p.x}" y2="92" stroke="var(--axis)" stroke-width="2.4"/>
                          <line x1="2" y1="92" x2="98" y2="92" stroke="var(--axis)" stroke-width="1.6"/>`;
    case "box":   return `<rect x="${p.x}" y="${p.y}" width="${p.w}" height="${92-p.y}" rx="1.5" ${s}/>
                          <line x1="2" y1="92" x2="98" y2="92" stroke="var(--axis)" stroke-width="1.6"/>`;
    case "step":  return `<rect x="${p.x}" y="${p.y}" width="40" height="${92-p.y}" rx="1.5" ${s}/>
                          <line x1="2" y1="92" x2="98" y2="92" stroke="var(--axis)" stroke-width="1.6"/>`;
    case "table": return `<rect x="14" y="${p.y}" width="76" height="3.5" rx="1.5" ${s}/>
                          <line x1="20" y1="${p.y+3}" x2="20" y2="92" stroke="var(--axis)" stroke-width="1.6"/>
                          <line x1="84" y1="${p.y+3}" x2="84" y2="92" stroke="var(--axis)" stroke-width="1.6"/>
                          <line x1="2" y1="92" x2="98" y2="92" stroke="var(--axis)" stroke-width="1.6"/>`;
    case "chair": return `<rect x="${p.x}" y="${p.y}" width="30" height="3.5" rx="1.5" ${s}/>
                          <line x1="${p.x+2}" y1="${p.y+3}" x2="${p.x+2}" y2="92" stroke="var(--axis)" stroke-width="1.6"/>
                          <line x1="${p.x+27}" y1="${p.y+3}" x2="${p.x+27}" y2="92" stroke="var(--axis)" stroke-width="1.6"/>
                          <line x1="${p.x+2}" y1="${p.y}" x2="${p.x+2}" y2="${p.y-22}" stroke="var(--axis)" stroke-width="1.6"/>
                          <line x1="2" y1="92" x2="98" y2="92" stroke="var(--axis)" stroke-width="1.6"/>`;
    default: return "";
  }
}

/* Roughly what each prop occupies, so the frame can be fitted to it. */
function propBox(p) {
  const floor = [2, 92, 98, 92];
  switch (p.t) {
    case "wall": case "post": return [Math.min(2,p.x), 6, Math.max(98,p.x), 92];
    case "box":   return [Math.min(2,p.x), p.y, Math.max(98,p.x+p.w), 92];
    case "step":  return [Math.min(2,p.x), p.y, Math.max(98,p.x+40), 92];
    case "table": return [2, p.y, 98, 92];
    case "chair": return [Math.min(2,p.x), p.y-22, Math.max(98,p.x+30), 92];
    default: return floor;
  }
}

/* Fit the frame to the movement so figures fill the card instead of
   floating in whitespace. Height is floored so wide poses (planks) don't
   render as a letterbox strip. */
function figViewBox(f) {
  let x0 = 100, y0 = 100, x1 = 0, y1 = 0;
  const eat = (x, y) => { x0=Math.min(x0,x); y0=Math.min(y0,y); x1=Math.max(x1,x); y1=Math.max(y1,y); };
  [f.a, f.b].forEach(p => {
    if (!p) return;
    const q = fullPose(p);
    JOINTS.forEach(k => { if (q[k]) eat(q[k][0], q[k][1]); });
    if (q.hd) { eat(q.hd[0]-8, q.hd[1]-8); eat(q.hd[0]+8, q.hd[1]+8); }
  });
  (f.props || []).forEach(pr => { const b = propBox(pr); eat(b[0], b[1]); eat(b[2], b[3]); });

  const pad = 4;
  x0 -= pad; y0 -= pad; x1 += pad; y1 += pad;
  const minH = 52;
  if (y1 - y0 < minH) {
    const grow = (minH - (y1 - y0)) / 2;
    y0 -= grow; y1 += grow;
  }
  return `${x0.toFixed(1)} ${y0.toFixed(1)} ${(x1-x0).toFixed(1)} ${(y1-y0).toFixed(1)}`;
}

function figureMarkup(id) {
  const f = FIG[id];
  if (!f) return "";
  const L = (n, cls) => `<line class="${cls}" data-j="${n}" stroke-linecap="round"/>`;
  return `<svg viewBox="${figViewBox(f)}" class="figure" data-fig="${id}" role="img"
      aria-label="Animated demonstration of the movement">
    <g class="fig-props">${(f.props||[]).map(propSVG).join("")}</g>
    <g class="fig-far">${L("thigh2","limb")}${L("shin2","limb")}${L("upper2","limb")}${L("fore2","limb")}</g>
    <g class="fig-near">
      ${L("spine","trunk")}${L("thigh","limb")}${L("shin","limb")}${L("upper","limb")}${L("fore","limb")}${L("foot","limb")}
      <circle class="fig-head" r="6.5"/>
    </g>
  </svg>`;
}

function setFigurePose(svg, pose) {
  const set = (n, p1, p2) => {
    const el = svg.querySelector(`[data-j="${n}"]`);
    if (!el) return;
    // A limb with no coordinates would otherwise draw as a round cap at the
    // origin — a stray dot in the corner of the frame.
    if (!p1 || !p2) { el.style.display = "none"; return; }
    el.style.display = "";
    el.setAttribute("x1", p1[0]); el.setAttribute("y1", p1[1]);
    el.setAttribute("x2", p2[0]); el.setAttribute("y2", p2[1]);
  };
  set("spine",  pose.sh,  pose.hip);  set("foot",  pose.an,  pose.toe);
  set("thigh",  pose.hip, pose.kn);   set("shin",  pose.kn,  pose.an);
  set("upper",  pose.sh,  pose.el);   set("fore",  pose.el,  pose.wr);
  set("thigh2", pose.hip, pose.kn2);  set("shin2", pose.kn2, pose.an2);
  set("upper2", pose.sh,  pose.el2);  set("fore2", pose.el2, pose.wr2);
  const h = svg.querySelector(".fig-head");
  if (h && pose.hd) { h.setAttribute("cx", pose.hd[0]); h.setAttribute("cy", pose.hd[1]); }
}

/* Lowering is deliberately slower than lifting — that's the tempo we want
   them copying, and it's where most of the benefit lives. */
const CYCLE = [
  { to: 1, ms: 2600 },   // lower
  { to: 1, ms: 260  },   // pause at the bottom
  { to: 0, ms: 1100 },   // lift
  { to: 0, ms: 420  },   // pause at the top
];

let figAnim = null;

function animateFigures(root) {
  stopFigures();
  const svgs = Array.from(root.querySelectorAll("svg.figure"));
  if (!svgs.length) return;
  const items = svgs.map(svg => {
    const f = FIG[svg.dataset.fig];
    return { svg, f, A: fullPose(f.a), B: fullPose(f.b || f.a) };
  });
  items.forEach(it => setFigurePose(it.svg, it.A));
  if (items.every(it => it.f.hold)) return;      // nothing to animate

  const total = CYCLE.reduce((a, s) => a + s.ms, 0);
  let start = null;
  const frame = ts => {
    if (start === null) start = ts;
    let e = (ts - start) % total, from = 0, t = 0;
    for (const step of CYCLE) {
      if (e < step.ms) { t = from + (step.to - from) * (e / step.ms); break; }
      e -= step.ms; from = step.to; t = step.to;
    }
    items.forEach(it => {
      if (it.f.hold) return;
      setFigurePose(it.svg, lerpPose(it.A, it.B, t));
    });
    figAnim = requestAnimationFrame(frame);
  };
  figAnim = requestAnimationFrame(frame);
}

function stopFigures() { if (figAnim) cancelAnimationFrame(figAnim); figAnim = null; }

/* ── The demo sheet ─────────────────────────────────────────────────── */

function showDemo(figId, name, cue, back) {
  const f = FIG[figId];
  if (!f) return;
  // Someone who asked the OS for less motion still deserves the demonstration,
  // so show the two ends of the rep side by side rather than looping.
  const still = !!(window.matchMedia &&
                   window.matchMedia("(prefers-reduced-motion: reduce)").matches) && !f.hold;
  const stage = still
    ? `<div class="demo-two">
         <figure>${figureMarkup(figId)}<figcaption>Start</figcaption></figure>
         <figure>${figureMarkup(figId)}<figcaption>Bottom</figcaption></figure>
       </div>`
    : `${figureMarkup(figId)}
       <span class="demo-tag">${f.hold ? "Hold this position" : "Slow down, faster up"}</span>`;

  openSheet(`
    <div class="grab"></div>
    <h3>${esc(name)}</h3>
    <div class="demo-stage">${stage}</div>
    <p class="demo-cue">${esc(cue || "")}</p>
    <p class="demo-h">Watch for</p>
    <ul class="demo-list">${(f.watch||[]).map(w => `<li>${esc(w)}</li>`).join("")}</ul>
    <button class="btn ghost" onclick="closeSheet()">${back || "Got it"}</button>
  `);

  if (still) {
    const svgs = $("#sheet").querySelectorAll("svg.figure");
    setFigurePose(svgs[0], fullPose(f.a));
    setFigurePose(svgs[1], fullPose(f.b));
  } else {
    animateFigures($("#sheet"));
  }
}

let sheetKind = null;

function openSheet(html) { $("#sheet").innerHTML = html; $("#veil").classList.add("on"); }

/* Demo entry points. Both re-derive the move rather than passing strings

function demoCurrentMove() {

function openLogWorkout() {
  sheetKind = "run";
  openSheet(`
    <div class="grab"></div>
    <h3>Log a workout</h3>
    <label class="f"><span>Type</span>
      <div class="seg" id="typeSeg">
        <button onclick="pickType('run')" class="on">Run</button>
        <button onclick="pickType('walk')">Walk</button>
        <button onclick="pickType('strength')">Strength</button>
        <button onclick="pickType('other')">Other</button>
      </div>
    </label>
    <label class="f"><span>Date</span>
      <input class="in" type="date" id="wDate" value="${today()}" max="${today()}"></label>
    <label class="f"><span>Duration (minutes)</span>
      <input class="in" type="number" id="wMin" inputmode="numeric" min="1" max="600" placeholder="30"></label>
    <label class="f" id="distField"><span>Distance (${dUnit()}) — optional</span>
      <input class="in" type="number" id="wDist" inputmode="decimal" step="0.01" min="0" placeholder="2.5"></label>
    <label class="f"><span>Note — optional</span>

      <button class="btn ghost" onclick="closeSheet()">Cancel</button>

function pickType(t) {
  sheetKind = t;
  document.querySelectorAll("#typeSeg button").forEach((b, i) =>
    b.classList.toggle("on", ["run","walk","strength","other"][i] === t));
  $("#distField").style.display = (t === "run" || t === "walk") ? "block" : "none";
}

function saveWorkout() {
  const min  = parseFloat($("#wMin").value);
  const dist = parseFloat($("#wDist") ? $("#wDist").value : "");
  const date = $("#wDate").value || today();
  if (!min || min <= 0) { alert("How many minutes did it take?"); return; }
  const titles = { run:"Run", walk:"Walk", strength:"Strength", other:"Workout" };
  S.workouts.push({
    id: uid(), date,
    type: sheetKind === "strength" ? "strength" : sheetKind === "other" ? "other" : "cardio",
    title: titles[sheetKind] || "Workout",
    duration: Math.round(min),
    distance: (dist && dist > 0) ? toStoreD(dist) : null,
    note: $("#wNote").value.trim(),
  });
  S.habits[date] = Object.assign({}, S.habits[date], { moved: true });
  save(); closeSheet(); render();
}

function openLogWeight() {
  const last = S.weights.length ? S.weights[S.weights.length-1] : null;
  openSheet(`
    <div class="grab"></div>
    <h3>Log your weight</h3>
    <p class="sub" style="margin-bottom:18px">No goal, no target — just the trend.
      Weigh in at the same time of day for a cleaner line.</p>
    <label class="f"><span>Date</span>
      <input class="in" type="date" id="gDate" value="${today()}" max="${today()}"></label>
    <label class="f"><span>Weight (${wUnit()})</span>
      <input class="in" type="number" id="gVal" inputmode="decimal" step="0.1" min="1"
        placeholder="${last ? toDisplayW(last.kg).toFixed(1) : (metric() ? "70" : "155")}"></label>
    <div class="btn-row">
      <button class="btn ghost" onclick="closeSheet()">Cancel</button>
      <button class="btn" onclick="saveWeight()">Save</button>
    </div>
  `);
  setTimeout(() => $("#gVal").focus(), 120);
}

function saveWeight() {
  const v = parseFloat($("#gVal").value);
  if (!v || v <= 0) { alert("Enter a weight."); return; }
  const date = $("#gDate").value || today();
  S.weights = S.weights.filter(w => w.date !== date);   // one reading per day
  S.weights.push({ id: uid(), date, kg: toStoreW(v) });
  S.weights.sort((a,b) => a.date < b.date ? -1 : 1);
  save(); closeSheet(); render();
}

function delItem(kind, id) {
  if (!confirm("Delete this entry?")) return;
  if (kind === "w") S.workouts = S.workouts.filter(x => x.id !== id);
  else              S.weights  = S.weights.filter(x => x.id !== id);
  save(); render();
}
